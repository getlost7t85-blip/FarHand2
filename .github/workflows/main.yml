      # android-actions/setup-android tries to install Google's old
      # "tools" package, which was removed from the SDK repository years
      # ago — that makes the action fail outright on a fresh install.
      # Installing the SDK directly avoids depending on it.
      - name: Set up Android SDK
        run: |
          export ANDROID_SDK_ROOT="$HOME/android-sdk"
          mkdir -p "$ANDROID_SDK_ROOT/cmdline-tools"
          cd "$ANDROID_SDK_ROOT/cmdline-tools"
          # If this 404s, get the current build number from
          # https://developer.android.com/studio#command-line-tools-only
          # and swap it in below.
          curl -fsSL -o tools.zip \
            "https://dl.google.com/android/repository/commandlinetools-linux-15859902_latest.zip"
          unzip -q tools.zip
          rm tools.zip
          mv cmdline-tools latest
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_SDK_ROOT/platform-tools" >> "$GITHUB_PATH"

      - name: Accept licenses and install SDK platform + build-tools
        run: |
          yes | sdkmanager --licenses --sdk_root="$ANDROID_HOME" > /dev/null || true
          sdkmanager --sdk_root="$ANDROID_HOME" "platform-tools" "platforms;android-34" "build-tools;34.0.0"
